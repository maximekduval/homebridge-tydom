name: Release

# Stages the package on npm when a version tag such as v1.0.1 is pushed. The
# staged version is not public until a maintainer approves it with 2FA, on
# npmjs.com (package > Staged Packages) or with `npm stage approve`.
#
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored
# in GitHub. The trusted publisher is configured on npmjs.com, in the package
# settings, for this repository and this workflow file name (release.yml) with
# the stage-only permission: `npm publish` is refused and `npm stage publish`
# is the only accepted command.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never cancel a publish in flight, and never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches package.json and is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm stage publish needs npm 11.15.0 or later, which Node 24 may not bundle.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      # The first version is published by hand, before the trusted publisher
      # can be configured (see RELEASING.md); its tag must not fail the run.
      - name: Skip a version that is already on npm
        id: published
        run: |
          spec="$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          if npm view "${spec}" version > /dev/null 2>&1; then
            echo "${spec} is already on npm, nothing to stage." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.skip != 'true'
        run: npm ci

      # What actually ships. `files` is narrow enough that a build that emitted
      # nothing would otherwise publish an empty package without complaint.
      - name: Inspect the tarball
        if: steps.published.outputs.skip != 'true'
        run: npm pack --dry-run

      # prepack runs the lint, the type check, the tests and the build before
      # packing.
      - name: Stage the package on npm
        if: steps.published.outputs.skip != 'true'
        run: npm stage publish

      - name: Explain how to approve
        if: steps.published.outputs.skip != 'true'
        run: |
          name="$(node -p "require('./package.json').name")"
          {
            echo "### ${GITHUB_REF_NAME} is staged on npm"
            echo
            echo "It is not public yet. Approve it with 2FA on npmjs.com (package > Staged Packages),"
            echo "or with the stage id printed by the \"Stage the package on npm\" step:"
            echo
            echo '```'
            echo "npm stage list ${name}"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
